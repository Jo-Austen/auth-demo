server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_demo?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: app
    password: app_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: change-this-to-a-strong-secret-key
  access-token-expiration: 3600000

logging:
  level:
    org.hibernate.SQL: info
